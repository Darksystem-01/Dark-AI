<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexia AI - Premium Assistant</title>
    <meta name="description" content="A highly advanced, lightning-fast AI assistant with image generation and multi-lingual support.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Markdown and Code Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar or Header area could go here, but we keep it sleek and full-screen for chat -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>Nexia AI</h1>
            </div>
            <div class="status-indicator">
                <span class="dot"></span> Online & Ready
            </div>
        </header>

        <main class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h2>How can I help you today?</h2>
                <p>I can write code, generate images, and assist you in any language.</p>
                <div class="suggestion-chips">
                    <button class="chip" onclick="setInput('Write a python script to sort an array')">Python Script</button>
                    <button class="chip" onclick="setInput('Draw a futuristic city with flying cars')">Generate Image</button>
                    <button class="chip" onclick="setInput('O\'zbek tilida she\'r yozib ber')">O'zbekcha</button>
                </div>
            </div>
            <!-- Chat messages will be injected here -->
        </main>

        <footer class="input-area">
            <form id="chatForm">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Message Nexia AI..." rows="1" autofocus></textarea>
                    <button type="submit" id="sendButton" class="send-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="footer-text">
                    Nexia AI generates images and text. Responses are lightning fast.
                </div>
            </form>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
